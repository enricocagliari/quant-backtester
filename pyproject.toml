[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbt"
version = "0.1.0"
description = "A small, auditable backtesting engine for daily securities strategies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enrico Cagliari" }]
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
qbt = "qbt.cli:main"

[tool.setuptools.packages.find]
include = ["qbt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
